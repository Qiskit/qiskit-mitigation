name: qiskit-ibm-runtime tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'stable/**'
  pull_request:
    branches:
      - main
      - 'stable/**'
  schedule:
    - cron: '0 1 * * *'

jobs:
  tests:
    name: qiskit-ibm-runtime ${{ matrix.qiskit-ibm-runtime-ref }} tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11"]
        qiskit-ibm-runtime-ref:
          - "0.50.0"
          - "0.51.0"
          - "main"
    env:
      QISKIT_IBM_RUNTIME_REF: ${{ matrix.qiskit-ibm-runtime-ref }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          pip install tox
      - name: Test using tox environment
        run: |
          tox -e qiskit-ibm-runtime
