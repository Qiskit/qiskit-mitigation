---
features:
  - |
    The ``custom_boxing_options`` argument of the ``prepare`` method of
    :class:`~qiskit_mitigation.MitigationTask`, :class:`~qiskit_mitigation.PEC`,
    :class:`~qiskit_mitigation.zne.PEA` and :class:`~qiskit_mitigation.zne.GateFolding`, and
    of :class:`~qiskit_mitigation.TREX`, can now also be a
    :class:`~qiskit.transpiler.PassManager`. The pass manager is used to box the circuit instead
    of the one generated by :meth:`~samplomatic.transpiler.generate_boxing_pass_manager` from the
    boxing options. Use it with caution: the annotations of the boxes define important details of
    the way the final executed circuit is created. The same applies to
    :func:`~qiskit_mitigation.find_combined_unique_layers`, which accepts a pass manager too.
    Note that :class:`~qiskit_mitigation.PEC` does not accept a :class:`~qiskit.transpiler.PassManager` as
    ``custom_boxing_options`` when ``noise_gain`` is ``"slc_local_scales"``, nor when computing
    shaded light-cone bounds with ``generate_slc_bounds_computation_input``, since these require the
    ``inject_noise_strategy`` boxing option.
