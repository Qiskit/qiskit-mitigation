---
features:
  - |
    Added the ``trim_measurements`` argument to the ``prepare`` methods of
    :class:`~qiskit_mitigation.MitigationTask`, :class:`~qiskit_mitigation.PEC`,
    :class:`~qiskit_mitigation.zne.PEA` and :class:`~qiskit_mitigation.zne.GateFolding`.
    When it is ``True``, the task measures only the qubits that have instructions on them or are
    in the support of the observables, and the measured qubits are stored in the ``meas_qubits``
    attribute of the task. Every task finds its own measured qubits, so tasks with different
    support can be combined in one program. The default is ``False``, which keeps measuring all the
    qubits of the circuit as before.

    When several trimmed tasks share a :class:`~qiskit_mitigation.TREX` instance, the TREX
    calibration measures the qubits ``0`` to ``m``, where ``m`` is the highest qubit measured by
    any of the tasks. A task that does not trim its measurements contributes all of its qubits.

    Trimming the measurements is not supported together with ``twirling_strategy="all"``, and
    raises a ``ValueError``.
  - |
    Added the ``observables`` argument to
    :func:`~qiskit_mitigation.find_combined_unique_layers` and to ``find_unique_layers`` of the
    mitigation tasks, to find the unique layers of circuits with trimmed measurements. Trimming
    changes the boxing of the circuit, so pass ``observables`` to the layer finder if and only if
    ``trim_measurements=True`` is passed to ``prepare``, and pass the same observables. Noise
    learned with a different choice is not found by ``PEC.prepare`` and ``PEA.prepare``, which
    raise a ``ValueError`` about the missing layer.
upgrade:
  - |
    The programs created by :class:`~qiskit_mitigation.MitigationTask`,
    :class:`~qiskit_mitigation.PEC`, :class:`~qiskit_mitigation.zne.PEA` and
    :class:`~qiskit_mitigation.zne.GateFolding` now save the version ``"0.2"`` in their
    passthrough data, together with ``meas_qubits`` and ``circuit_num_qubits``. Older versions of
    the library cannot post-process them. Programs created with version ``"0.1"`` can still be
    loaded and post-processed.
  - |
    :class:`~qiskit_mitigation.TREX` now registers a task only at the end of the task's
    ``prepare``, so a task whose preparation failed no longer remains connected to the TREX
    instance and no longer widens its calibration.
