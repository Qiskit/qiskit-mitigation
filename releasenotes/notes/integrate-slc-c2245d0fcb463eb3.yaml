---
features:
  - |
    Add new functions to the PEC class - :meth:`.PEC.generate_slc_bounds_computation_input` and :meth:`.PEC.set_slc_local_scales`, which allow 
    integrating shaded light-cones bounds into the PEC mitigation in order to reduce the sampling overhead of the 
    mitigation in the price of tolerating some pre-determined bias in the result.
